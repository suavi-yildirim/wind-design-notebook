name: Tests and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: verify/requirements.txt
      - name: Install Python dependencies
        run: pip install -r verify/requirements.txt
      - name: Python FE tests
        run: pytest verify -q
      - name: Node tests
        run: node --test
      - name: Fixture freshness
        # Numeric comparison (rel. 1e-4): eigenvalues differ in the last digits between LAPACK builds.
        run: python verify/generate_fixtures.py --check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'docs' --exclude 'verify' --exclude 'test' \
            --exclude '_site' --exclude 'package.json' --exclude '.gitignore' --exclude '.claude' --exclude '.superpowers' \
            ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
